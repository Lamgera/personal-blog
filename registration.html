<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Personal ID</title>
    <link
      rel="icon"
      href="frontend/src/images/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="frontend/src/styles/index.css" />
  </head>
  <body>
    <main class="registration-page">
      <section class="registration-section">
        <h1 class="registration-title">Регистрация</h1>

        <form
          class="login-form registration-form"
          id="registration-form"
          novalidate
        >
          <!-- Сообщение формы (успех / ошибка) -->
          <span
            class="form-message"
            id="form-message"
            aria-live="polite"
          ></span>

          <!-- Email -->
          <div class="form-field">
            <label class="form-label" for="reg-email">Email</label>
            <input
              class="form-input"
              type="email"
              id="reg-email"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="email"
            />
            <span class="form-error" id="reg-email-error"></span>
          </div>

          <!-- Пароль -->
          <div class="form-field">
            <label class="form-label" for="reg-password">Пароль</label>
            <div class="password-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-password"
                name="password"
                placeholder="Введите пароль"
                required
                minlength="6"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Показать пароль"
              >
                <svg
                  class="eye-open"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="eye-closed"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.55 19.55 0 0 1-3.17 4.19M1 1l22 22"
                  />
                </svg>
              </button>
            </div>
            <span class="form-error" id="reg-password-error"></span>
          </div>

          <!-- Подтверждение пароля -->
          <div class="form-field">
            <label class="form-label" for="reg-confirm-password"
              >Подтвердите пароль</label
            >
            <div class="password-wrapper">
              <input
                class="form-input"
                type="password"
                id="reg-confirm-password"
                name="confirmPassword"
                placeholder="Введите пароль ещё раз"
                required
                minlength="6"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle"
                aria-label="Показать пароль"
              >
                <!-- SVG иконки (те же самые) -->
                <svg
                  class="eye-open"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="eye-closed"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.55 19.55 0 0 1-3.17 4.19M1 1l22 22"
                  />
                </svg>
              </button>
            </div>
            <span class="form-error" id="reg-confirm-password-error"></span>
          </div>

          <!-- Кнопка отправки -->
          <button class="form-submit" type="submit" disabled>
            <span class="button-text">Зарегистрироваться</span>
            <span class="button-loading">Загрузка...</span>
          </button>

          <p class="registration-link">
            Уже есть аккаунт? <a href="index.html#login">Войти</a>
          </p>
        </form>
      </section>
    </main>

    <script
      type="module"
      src="frontend/src/scripts/registration.js"
      defer
    ></script>
  </body>
</html>
